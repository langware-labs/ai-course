    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #241D19; direction: rtl; }\n  a { color: #7A2E1E; }\n  a:hover { color: #A8462C; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"d327bc9a-c6cb-4208-9938-04a2a867fea5#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section dir=\"rtl\" data-label=\"שקופית פתיחה\" data-screen-label=\"01\" data-speaker-notes=\"לפתוח את המסגרת: את שלוש המילים האלה שומעים כל הזמן. בסוף עשר דקות כל אחד יוכל להסביר כל אחת מהן למישהו אחר.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 100px 100px 80px; gap: 40px;\">\n    <div style=\"font-size: 28px; letter-spacing: 0.12em; color: #7A2E1E; font-weight: 600;\">הסבר של עשר דקות<\u002Fdiv>\n    <h1 style=\"margin: 0; font-size: 140px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; max-width: 1500px;\">בינה מלאכותית בשפה פשוטה<\u002Fh1>\n    <p style=\"margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 50px; line-height: 1.3; color: #4A403A; max-width: 1250px;\">שלוש מילים מסבירות כמעט כל מה ששומעים על בינה מלאכותית: <span style=\"color: #7A2E1E;\">מודל, מעטפת, סוכן.<\u002Fspan><\u002Fp>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"שלוש מילים\" data-screen-label=\"02\" data-speaker-notes=\"להציג את המבנה: מילה אחת לכל חלק. לספר לכיתה שהדימוי של הכיתה והשולחן מלווה את כל המצגת.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 60px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">שלוש מילים<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 48px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n          <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M24 13 L8 9 L8 37 L24 41 Z\"><\u002Fpath><path d=\"M24 13 L40 9 L40 37 L24 41 Z\"><\u002Fpath><path d=\"M13 18 L19 19.5\"><\u002Fpath><path d=\"M13 25 L19 26.5\"><\u002Fpath><path d=\"M29 18 L35 19.5\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 64px; line-height: 1; color: #D6BFB2;\">01<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 44px; font-weight: 700;\">מודל שפה (LLM)<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">תלמיד שקרא כמעט הכול, ולא זוכר מאיפה.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 48px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n          <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><rect x=\"5\" y=\"11\" width=\"38\" height=\"24\"><\u002Frect><rect x=\"17\" y=\"18\" width=\"14\" height=\"10\"><\u002Frect><path d=\"M11 35 L11 42\"><\u002Fpath><path d=\"M37 35 L37 42\"><\u002Fpath><path d=\"M24 6 L24 11\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 64px; line-height: 1; color: #D6BFB2;\">02<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 44px; font-weight: 700;\">מעטפת (Harness)<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">השולחן שהוא יושב בו, עם מחשבון, כרטיס ספרייה וכללי בית.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 48px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n          <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M8 14 L12 18 L18 10\"><\u002Fpath><path d=\"M24 14 L41 14\"><\u002Fpath><path d=\"M8 26 L12 30 L18 22\"><\u002Fpath><path d=\"M24 26 L41 26\"><\u002Fpath><path d=\"M8 38 L12 42 L18 34\"><\u002Fpath><path d=\"M24 38 L41 38\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 64px; line-height: 1; color: #D6BFB2;\">03<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 44px; font-weight: 700;\">סוכן (Agent)<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">אותו תלמיד עובד לפי רשימת משימות, בלי שיגידו לו כל צעד.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"מה זה מודל שפה\" data-screen-label=\"03\" data-speaker-notes=\"LLM הוא קיצור של Large Language Model. גדול: אומן על כמות עצומה של טקסט. שפה: טקסט נכנס, טקסט יוצא. מודל: הוא למד תבניות, הוא לא שמר מסד נתונים.\" style=\"background: #241D19; color: #F7F2EC; font-family: Heebo, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 100px 100px 80px; gap: 48px;\">\n    <div style=\"font-size: 28px; letter-spacing: 0.12em; color: #D9A38B; font-weight: 600;\">מילה ראשונה<\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 96px; font-weight: 800; letter-spacing: -0.02em;\">מה זה מודל שפה<\u002Fh2>\n    <div style=\"display: flex; gap: 64px; align-items: flex-start;\">\n      <p style=\"margin: 0; font-size: 40px; line-height: 1.5; max-width: 820px; color: #E7DCD2;\">קיצור של <span style=\"color: #F5C4AC;\">Large Language Model<\u002Fspan>. זו תוכנה שקראה כמות עצומה של טקסט ולמדה את התבניות שבו. אתם נותנים לה מילים, והיא מחזירה מילים.<\u002Fp>\n      <p style=\"margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 40px; line-height: 1.5; max-width: 640px; color: #C4B3A6;\">היא לא שיננה את הספרייה. היא למדה איך משפטים בספרייה נוטים להיראות.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"ניחוש המילה הבאה\" data-screen-label=\"04\" data-speaker-notes=\"כל מה שמודל שפה עושה הוא זה, שוב ושוב. לקרוא את המשפט בקול ולתת לכיתה להשלים את המילה לפני החשיפה. ואז לומר: הוא עושה את זה אלפי פעמים ברצף, וכך יוצא חיבור.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 56px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">הוא מנחש את המילה הבאה<\u002Fh2>\n    <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 64px; display: flex; flex-direction: column; gap: 40px;\">\n      <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 64px; line-height: 1.3;\">עיר הבירה של צרפת היא <span style=\"background: #7A2E1E; color: #F7F2EC; padding: 4px 20px;\">פריז<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"font-size: 28px; color: #7A6C63; letter-spacing: 0.06em; font-weight: 600;\">כמה סיכוי נתן לכל מילה<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 110px; gap: 28px; align-items: center;\">\n          <div style=\"font-size: 32px; font-weight: 700;\">פריז<\u002Fdiv>\n          <div style=\"height: 26px; background: #EFE5D9;\"><div style=\"width: 88%; height: 100%; background: #7A2E1E;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size: 30px; color: #4A403A;\">88%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 110px; gap: 28px; align-items: center;\">\n          <div style=\"font-size: 32px; color: #4A403A;\">ליון<\u002Fdiv>\n          <div style=\"height: 26px; background: #EFE5D9;\"><div style=\"width: 6%; height: 100%; background: #C58D74;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size: 30px; color: #4A403A;\">6%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 110px; gap: 28px; align-items: center;\">\n          <div style=\"font-size: 32px; color: #4A403A;\">גדולה<\u002Fdiv>\n          <div style=\"height: 26px; background: #EFE5D9;\"><div style=\"width: 4%; height: 100%; background: #C58D74;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size: 30px; color: #4A403A;\">4%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 110px; gap: 28px; align-items: center;\">\n          <div style=\"font-size: 32px; color: #4A403A;\">לא<\u002Fdiv>\n          <div style=\"height: 26px; background: #EFE5D9;\"><div style=\"width: 2%; height: 100%; background: #C58D74;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size: 30px; color: #4A403A;\">2%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 36px; line-height: 1.5; max-width: 1350px; color: #4A403A;\">עושים את זה כמה אלפי פעמים ברצף ומקבלים חיבור שלם. אין תוכנית ואין חיפוש, רק המילה הבאה הסבירה ביותר.<\u002Fp>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"מה הוא לא יכול לבד\" data-screen-label=\"05\" data-speaker-notes=\"השקופית הזו היא הגשר. כל מגבלה כאן היא הסיבה שהמעטפת קיימת. כדאי להדגיש: תשובות שגויות שנשמעות בטוחות הן אופן הכישלון הרגיל, לא תקלה נדירה.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 56px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">מה הוא לא יכול לעשות לבד<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 0; border-top: 1px solid #D8CCBE;\">\n      <div style=\"display: grid; grid-template-columns: 72px 440px 1fr; gap: 40px; padding: 44px 0; border-bottom: 1px solid #D8CCBE; align-items: center;\">\n        <svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round;\"><circle cx=\"21\" cy=\"21\" r=\"13\"><\u002Fcircle><path d=\"M31 31 L42 42\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 40px; font-weight: 700;\">לחפש מידע<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">אין אינטרנט, אין ספר לימוד, אין מחשבון. רק מה שנספג באימון.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 72px 440px 1fr; gap: 40px; padding: 44px 0; border-bottom: 1px solid #D8CCBE; align-items: center;\">\n        <svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round;\"><circle cx=\"24\" cy=\"24\" r=\"16\"><\u002Fcircle><path d=\"M24 14 L24 24 L32 28\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 40px; font-weight: 700;\">לזכור אותך<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">כל שיחה מתחילה מדף חלק. שום דבר לא נשמר, אלא אם משהו מחזיר לו אותו.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 72px 440px 1fr; gap: 40px; padding: 44px 0; border-bottom: 1px solid #D8CCBE; align-items: center;\">\n        <svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round;\"><circle cx=\"24\" cy=\"24\" r=\"16\"><\u002Fcircle><path d=\"M24 14 L24 27\"><\u002Fpath><path d=\"M24 33 L24 34\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 40px; font-weight: 700;\">לדעת שהוא טועה<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">תשובה מומצאת ותשובה נכונה נוצרות באותה דרך, ונשמעות בטוחות באותה מידה.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"מה זה מעטפת\" data-screen-label=\"06\" data-speaker-notes=\"מילה שנייה. המעטפת היא התוכנה שעוטפת את המודל. כשמשתמשים בצ׳אט, אף פעם לא מדברים עם מודל חשוף, אלא עם מודל בתוך מעטפת.\" style=\"background: #241D19; color: #F7F2EC; font-family: Heebo, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 100px 100px 80px; gap: 48px;\">\n    <div style=\"font-size: 28px; letter-spacing: 0.12em; color: #D9A38B; font-weight: 600;\">מילה שנייה<\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 96px; font-weight: 800; letter-spacing: -0.02em;\">מה זה מעטפת<\u002Fh2>\n    <div style=\"display: flex; gap: 64px; align-items: flex-start;\">\n      <p style=\"margin: 0; font-size: 40px; line-height: 1.5; max-width: 820px; color: #E7DCD2;\">התוכנה שעוטפת את המודל. היא קובעת מה אומרים למודל, לאילו כלים הוא יכול לפנות, ומה אסור לו לעשות.<\u002Fp>\n      <p style=\"margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 40px; line-height: 1.5; max-width: 640px; color: #C4B3A6;\">התלמיד הוא אותו תלמיד. המעטפת היא השולחן, הכללים והציוד שעליו.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 24px; border-top: 1px solid #4A3D35; padding-top: 36px;\">\n      <div style=\"font-size: 28px; letter-spacing: 0.06em; color: #A8968A; font-weight: 600;\">דוגמאות למעטפות<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font-size: 36px; font-weight: 700; color: #F5C4AC;\">Claude Code<\u002Fdiv>\n          <div style=\"font-size: 28px; line-height: 1.45; color: #C4B3A6;\">עוטף מודל בטרמינל, עם גישה לקבצים ולפקודות של הפרויקט.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font-size: 36px; font-weight: 700; color: #F5C4AC;\">Cursor<\u002Fdiv>\n          <div style=\"font-size: 28px; line-height: 1.45; color: #C4B3A6;\">עוטף מודל בעורך קוד, ומראה לו את הקוד שפתוח לפניכם.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font-size: 36px; font-weight: 700; color: #F5C4AC;\">Codex<\u002Fdiv>\n          <div style=\"font-size: 28px; line-height: 1.45; color: #C4B3A6;\">עוטף מודל בסביבה משלו, שמריצה את המשימה ומחזירה תוצאה.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"מה המעטפת מוסיפה\" data-screen-label=\"07\" data-speaker-notes=\"כל משבצת כאן היא מגבלה משקופית חמש, שנפתרה. כדאי לציין שהמודל עצמו לא השתנה בכלל בין שתי השקופיות.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 48px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">מה המעטפת מוסיפה<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 32px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 44px; display: flex; flex-direction: column; gap: 18px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M28 6 A10 10 0 1 0 40 18 L26 32 L16 42 L6 32 L16 22 L30 8\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 36px; font-weight: 700; color: #7A2E1E;\">כלים<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">חיפוש באינטרנט, מחשבון, הרצת קוד, הקבצים של בית הספר.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 44px; display: flex; flex-direction: column; gap: 18px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><rect x=\"8\" y=\"8\" width=\"32\" height=\"32\"><\u002Frect><path d=\"M16 4 L16 8\"><\u002Fpath><path d=\"M24 4 L24 8\"><\u002Fpath><path d=\"M32 4 L32 8\"><\u002Fpath><path d=\"M16 40 L16 44\"><\u002Fpath><path d=\"M24 40 L24 44\"><\u002Fpath><path d=\"M32 40 L32 44\"><\u002Fpath><rect x=\"18\" y=\"18\" width=\"12\" height=\"12\"><\u002Frect><\u002Fsvg>\n        <div style=\"font-size: 36px; font-weight: 700; color: #7A2E1E;\">זיכרון<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">שומרת את השיחה ומחזירה אותה בכל תור.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 44px; display: flex; flex-direction: column; gap: 18px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M12 5 L30 5 L38 13 L38 43 L12 43 Z\"><\u002Fpath><path d=\"M30 5 L30 13 L38 13\"><\u002Fpath><path d=\"M18 22 L32 22\"><\u002Fpath><path d=\"M18 30 L32 30\"><\u002Fpath><path d=\"M18 36 L26 36\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 36px; font-weight: 700; color: #7A2E1E;\">הוראות<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">תדריך קבוע שאתם לא רואים: תהיה מועיל, תהיה בטוח, תישאר בנושא.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 44px; display: flex; flex-direction: column; gap: 18px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><circle cx=\"24\" cy=\"24\" r=\"17\"><\u002Fcircle><path d=\"M12 36 L36 12\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 36px; font-weight: 700; color: #7A2E1E;\">מגבלות<\u002Fdiv>\n        <div style=\"font-size: 32px; line-height: 1.45; color: #4A403A;\">דברים שהיא תסרב לעשות, ופעולות שדורשות אישור של אדם.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"מה זה סוכן\" data-screen-label=\"08\" data-speaker-notes=\"מילה שלישית. בצ׳אט רגיל יש שאלה אחת ותשובה אחת. סוכן ממשיך: הוא מתכנן, משתמש בכלי, בודק את התוצאה ומחליט מה הצעד הבא.\" style=\"background: #241D19; color: #F7F2EC; font-family: Heebo, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 100px 100px 80px; gap: 48px;\">\n    <div style=\"font-size: 28px; letter-spacing: 0.12em; color: #D9A38B; font-weight: 600;\">מילה שלישית<\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 96px; font-weight: 800; letter-spacing: -0.02em;\">מה זה סוכן<\u002Fh2>\n    <div style=\"display: flex; gap: 64px; align-items: flex-start;\">\n      <p style=\"margin: 0; font-size: 40px; line-height: 1.5; max-width: 820px; color: #E7DCD2;\">מודל בתוך מעטפת שמקבל מטרה במקום שאלה, וממשיך לבצע צעדים עד שהמטרה הושלמה.<\u002Fp>\n      <p style=\"margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 40px; line-height: 1.5; max-width: 640px; color: #C4B3A6;\">לא לענות על שאלה אחת, אלא לעבוד לפי רשימת משימות ולכתוב את הפריט הבא בעצמו.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"סוכן בעבודה\" data-screen-label=\"09\" data-speaker-notes=\"לעבור על ארבעת הצעדים. הלופ הוא כל הרעיון: לפעול, להסתכל, להחליט, לחזור. צ׳אט רגיל עוצר אחרי הצעד הראשון.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 52px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">הלופ של הסוכן<\u002Fh2>\n    <div style=\"display: flex; gap: 72px; align-items: center;\">\n      <div style=\"display: flex; flex-direction: column; gap: 32px; flex: 1;\">\n        <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; line-height: 1.35; color: #7A2E1E;\">מטרה: ״מצא שלושה מקורות לעבודה בהיסטוריה וסכם כל אחד מהם.״<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.5; color: #4A403A;\">הסוכן לא מסיים בתשובה אחת. הוא מפעיל כלי, קורא את מה שחזר, וחוזר לחשוב עם המידע החדש. הלופ הזה מסתובב עד שהמטרה הושלמה.<\u002Fdiv>\n        <div style=\"font-size: 30px; line-height: 1.5; color: #7A6C63;\">בעולם התוכנה קוראים לצעד של הפעלת כלי <span style=\"direction: ltr; unicode-bidi: embed;\">Function Calling<\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; width: 560px; height: 640px; flex: none;\">\n        <svg width=\"560\" height=\"560\" sc-camel-view-box=\"0 0 600 600\" style=\"position: absolute; top: 0; left: 0; stroke: #C58D74; stroke-width: 14; fill: none; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1);\"><path d=\"M320 70.9 A230 230 0 0 1 529.1 279.9\"><\u002Fpath><path d=\"M517.4 260.9 L529.1 279.9 L537.3 259.1\"><\u002Fpath><path d=\"M529.1 320 A230 230 0 0 1 320 529.1\"><\u002Fpath><path d=\"M339.1 517.4 L320 529.1 L340.8 537.3\"><\u002Fpath><path d=\"M279.9 529.1 A230 230 0 0 1 70.9 320\"><\u002Fpath><path d=\"M82.6 339.1 L70.9 320 L62.7 340.8\"><\u002Fpath><path d=\"M70.9 279.9 A230 230 0 0 1 279.9 70.9\"><\u002Fpath><path d=\"M260.9 82.6 L279.9 70.9 L259.1 62.7\"><\u002Fpath><\u002Fsvg>\n        <div style=\"position: absolute; top: 78px; left: 50%; transform: translateX(-50%); width: 240px; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.3;\">שאלה מהמשתמש<\u002Fdiv>\n        <div style=\"position: absolute; top: 280px; right: 78px; transform: translateY(-50%); width: 150px; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.3;\">קריאה לכלי<\u002Fdiv>\n        <div style=\"position: absolute; bottom: 158px; left: 50%; transform: translateX(-50%); width: 240px; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.3;\">חשיבה של המודל<\u002Fdiv>\n        <div style=\"position: absolute; top: 280px; left: 78px; transform: translateY(-50%); width: 150px; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.3;\">תשובה או פעולה<\u002Fdiv>\n        <div style=\"position: absolute; bottom: 0; left: 0; width: 100%; text-align: center; font-family: 'Frank Ruhl Libre', serif; font-size: 40px; line-height: 1.3; color: #7A2E1E; white-space: nowrap;\">סוכן = מודל + כלים<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n  <\u002Fsection>\n\n  \n  <section dir=\"rtl\" data-label=\"אילו כלים\" data-screen-label=\"10\" data-speaker-notes=\"כלי הוא פעולה שהמודל יכול לבקש שתקרה, והמעטפת מבצעת בשבילו. המודל לא מפעיל שום דבר בעצמו, הוא רק מבקש. זו נקודה חשובה לבטיחות.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 44px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">אילו כלים סוכן יכול להפעיל<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><circle cx=\"24\" cy=\"24\" r=\"17\"><\u002Fcircle><path d=\"M7 24 L41 24\"><\u002Fpath><path d=\"M24 7 C31 14 31 34 24 41 C17 34 17 14 24 7 Z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">חיפוש באינטרנט<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">מביא מידע עדכני, שלא היה קיים בזמן האימון.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M12 5 L30 5 L38 13 L38 43 L12 43 Z\"><\u002Fpath><path d=\"M30 5 L30 13 L38 13\"><\u002Fpath><path d=\"M18 24 L32 24\"><\u002Fpath><path d=\"M18 32 L28 32\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">קריאה וכתיבה של קבצים<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">פותח מסמך, מסכם אותו, ושומר גרסה חדשה.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><path d=\"M18 15 L7 24 L18 33\"><\u002Fpath><path d=\"M30 15 L41 24 L30 33\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">הרצת קוד<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">כותב תוכנית קטנה, מריץ אותה, ומסתכל על התוצאה.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><rect x=\"10\" y=\"5\" width=\"28\" height=\"38\"><\u002Frect><path d=\"M16 14 L32 14\"><\u002Fpath><path d=\"M16 24 L18 24\"><\u002Fpath><path d=\"M23 24 L25 24\"><\u002Fpath><path d=\"M30 24 L32 24\"><\u002Fpath><path d=\"M16 33 L18 33\"><\u002Fpath><path d=\"M23 33 L25 33\"><\u002Fpath><path d=\"M30 33 L32 33\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">חישוב מדויק<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">מעביר את המספרים למחשבון, במקום לנחש אותם.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><rect x=\"6\" y=\"11\" width=\"36\" height=\"26\"><\u002Frect><path d=\"M6 11 L24 26 L42 11\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">שליחת הודעות<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">שולח מייל או הודעה, אחרי שאדם אישר.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E3D9CD; padding: 40px; display: flex; flex-direction: column; gap: 16px;\">\n        <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 48 48\" style=\"stroke: #7A2E1E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;\"><ellipse cx=\"24\" cy=\"12\" rx=\"16\" ry=\"6\"><\u002Fellipse><path d=\"M8 12 L8 36 C8 39 15 42 24 42 C33 42 40 39 40 36 L40 12\"><\u002Fpath><path d=\"M8 24 C8 27 15 30 24 30 C33 30 40 27 40 24\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 34px; font-weight: 700;\">מסדי נתונים ומערכות<\u002Fdiv>\n        <div style=\"font-size: 28px; line-height: 1.45; color: #4A403A;\">שולף נתונים ממערכת אחרת, למשל מערכת הציונים.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 30px; line-height: 1.5; color: #7A6C63;\">המודל לא מפעיל כלום בעצמו. הוא מבקש, והמעטפת מחליטה אם לבצע.<\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-label=\"שלוש המילים ביחד\" data-screen-label=\"11\" data-speaker-notes=\"סיכום בשורה לכל מילה. אפשר לבקש מהכיתה להחזיר את הדימוי לפני שמראים אותו.\" style=\"background: #F7F2EC; color: #1F1B18; font-family: Heebo, sans-serif; display: flex; flex-direction: column; padding: 100px 100px 80px; gap: 52px;\">\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em;\">שלוש המילים ביחד<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 0; border-top: 1px solid #D8CCBE;\">\n      <div style=\"display: grid; grid-template-columns: 360px 1fr 1fr; gap: 48px; padding: 40px 0; border-bottom: 1px solid #D8CCBE; align-items: baseline;\">\n        <div style=\"font-size: 44px; font-weight: 800;\">מודל שפה<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">מנחש מילים. קרא המון, בלי כלים.<\u002Fdiv>\n        <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 36px; color: #7A2E1E;\">התלמיד<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 360px 1fr 1fr; gap: 48px; padding: 40px 0; border-bottom: 1px solid #D8CCBE; align-items: baseline;\">\n        <div style=\"font-size: 44px; font-weight: 800;\">מעטפת<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">נותנת לו כלים, זיכרון, הוראות ומגבלות.<\u002Fdiv>\n        <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 36px; color: #7A2E1E;\">השולחן<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 360px 1fr 1fr; gap: 48px; padding: 40px 0; border-bottom: 1px solid #D8CCBE; align-items: baseline;\">\n        <div style=\"font-size: 44px; font-weight: 800;\">סוכן<\u002Fdiv>\n        <div style=\"font-size: 34px; line-height: 1.45; color: #4A403A;\">מקבל מטרה וממשיך לעבוד עד שהיא נגמרת.<\u002Fdiv>\n        <div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 36px; color: #7A2E1E;\">רשימת המשימות<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section dir=\"rtl\" data-labe
