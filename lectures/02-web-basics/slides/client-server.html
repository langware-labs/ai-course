<script>
/* Flowpad lesson bridge — generic displayContext wiring (same contract as the HTML module).
 * Inside Flowpad the host sets __FLOWPAD_API_URL__ and __FLOWPAD_PROCESS_ID__.
 * Opened on its own the bridge is absent and the page works without Neti. */
(function () {
  var api = globalThis.__FLOWPAD_API_URL__, pid = globalThis.__FLOWPAD_PROCESS_ID__;
  if (!api || !pid) { window.__lessonBridge = null; return; }
  var ready = (async function () {
    var sdk = await import(api + '/sdk/flowpad-sdk.js');
    await sdk.initSdk();
    var proc = await sdk.dataManager.getByTypeId(new sdk.TypeId('agentic_process', pid));
    if (!proc) throw new Error('process not found: ' + pid);
    return proc;
  })();
  ready.catch(function (e) { console.warn('[lesson-bridge] unavailable', e); });
  var timer = null, pending = null;
  async function write(state) {
    try { await (await ready).setDisplayContext(state); }
    catch (e) { console.warn('[lesson-bridge] setDisplayContext failed', e); }
  }
  window.__lessonBridge = {
    ready: ready,
    context: function (state) {
      pending = state; clearTimeout(timer);
      timer = setTimeout(function () { var s = pending; pending = null; write(s); }, 500);
    },
    notify: async function (message, state) {
      clearTimeout(timer); pending = null;
      await write(state);
      await (await ready).enqueue(message, 'lesson');
    }
  };
})();
</script>
<style>

<body>
<div class="app">
  <header>
    <div class="brand"><span class="glyph">⇄</span><span class="name">Client ⇄ Server</span><span class="tag">talk to a real API</span></div>
    <div class="dots" id="dots"></div>
    <div class="nav"><button class="btn-ghost" id="prev">← prev</button><button class="btn-dark" id="next">next →</button></div>
  </header>
  <div class="main">
    <section class="brief">
      <div class="kicker-row">
        <div class="kicker" id="kicker"></div>
        <button class="explain" id="explainBtn" title="נטי מסבירה על מה התרגיל הזה">🧑‍🏫 נטי מסבירה</button>
      </div>

        <textarea id="ask" dir="auto" placeholder="מה לא ברור? אפשר גם להשאיר ריק ופשוט לבקש רמז"></textarea>

<script src="bakery-api.js"></script>
<script>
/* ─────────────────────────────── The server ───────────────────────────────
 * The bakery lives in `bakery-api.js`, next door. The student's code runs in a
 * sandboxed frame; its fetch() calls are relayed here and answered like a real
 * server would, so every request and response shows up in the network panel.
 *
 * Next door rather than in this page because the HTTP lab on the previous step
 * aims at the same address, and a student who meets two different bakeries at
 * one address learns the wrong lesson. */
const { HOST, MENU, handle } = window.__bakery;

/* ─────────────────────────────── The lessons ─────────────────────────────── */
const SO = '<' + 'script>', SC = '<' + '/script>';
const req = (run, pred) => run.requests.some(pred);
const text = run => run.text.toLowerCase();

const L = [
  {
    kicker: 'Lesson 01 · Requests',
    title: 'The browser asks, the server answers',
    file: 'menu.html',
    blurb: 'Your page is the client. It sends a request to a server and waits for a response. In JavaScript, fetch(url) sends the request, and every response comes back with a status code that says how it went.',
    notes: [
      'The server lives at <code>https://bakery.flowpad.test</code>. The menu is at the path <code>/menu</code>.',
      '<code>const res = await fetch(url)</code> waits for the response. <code>await</code> only works inside an <code>async function</code>.',
      '<code>res.status</code> is a number: <code>200</code> means OK. Watch the network panel below as you type.'
    ],
    code: '<h2>Today\'s menu</h2>\n<p id="status">Not asked yet</p>\n\n' + SO + '\n  async function load() {\n    // ask the server for the menu here\n  }\n  load();\n' + SC,
    tasks: [
      { label: 'Send a GET request to /menu', test: run => req(run, r => r.method === 'GET' && r.path === '/menu') },
      { label: 'Show the response status code inside #status', test: (run, code) => /\.status\b/.test(code) && /\b200\b/.test(run.text) }
    ]
  },
  {
    kicker: 'Lesson 02 · JSON',
    title: 'Responses carry data',
    file: 'menu.html',
    blurb: 'A status code alone says little. The body of the response carries the data, and APIs usually send it as JSON: text that looks like JavaScript objects and arrays. Turn it into real objects with res.json().',
    notes: [
      '<code>const items = await res.json()</code> gives you an array of menu items.',
      'Each item looks like <code>{ id, name, type, price }</code>. Open a row in the network panel to see the raw JSON.',
      'Build the list with a loop, e.g. <code>for (const item of items) { ... }</code>.'
    ],
    code: '<h2>Today\'s menu</h2>\n<ul id="menu"></ul>\n\n' + SO + '\n  async function load() {\n    const res = await fetch("https://bakery.flowpad.test/menu");\n    // read the JSON body and show every item\n  }\n  load();\n' + SC,
    tasks: [
      { label: 'Read the body with res.json()', test: (run, code) => /\.json\(\s*\)/.test(code) },
      { label: 'Show at least one item name on the page', test: run => MENU.some(i => text(run).includes(i.name.toLowerCase())) },
      { label: 'Show all four items', test: run => MENU.every(i => text(run).includes(i.name.toLowerCase())) }
    ]
  },
  {
    kicker: 'Lesson 03 · Query strings',
    title: 'Ask for exactly what you need',
    file: 'bread.html',
    blurb: 'The URL can carry questions. A query string starts with ? and holds name=value pairs. Instead of downloading everything and filtering in the browser, you can ask the server to do the filtering.',
    notes: [
      'Anatomy of a URL: <code>https://host</code> + <code>/path</code> + <code>?name=value</code>.',
      'This server understands <code>type</code>. Try <code>/menu?type=pastry</code> and look at the response.',
      'Several pairs are joined with <code>&amp;</code>, like <code>?a=1&amp;b=2</code>.'
    ],
    code: '<h2>Fresh bread</h2>\n<ul id="menu"></ul>\n\n' + SO + '\n  async function load() {\n    const res = await fetch("https://bakery.flowpad.test/menu");\n    const items = await res.json();\n    for (const item of items) {\n      document.getElementById("menu").innerHTML += "<li>" + item.name + "</li>";\n    }\n  }\n  load();\n' + SC,
    tasks: [
      { label: 'Ask the server for bread only, using the query string', test: run => req(run, r => r.method === 'GET' && r.path === '/menu' && r.search.get('type') === 'bread') },
      { label: 'Show only the breads: Sourdough and Baguette', test: run => text(run).includes('sourdough') && text(run).includes('baguette') && !text(run).includes('croissant') && !text(run).includes('cinnamon') }
    ]
  },
  {
    kicker: 'Lesson 04 · Status codes',
    title: 'When the answer is no',
    file: 'item.html',
    blurb: 'Not every request succeeds. The server says why with the status code: 4xx means the client asked for something wrong, 5xx means the server failed. fetch does not throw on a 404, so your code has to check.',
    notes: [
      '<code>/menu/1</code> returns one item. There is no item <code>42</code>, so <code>/menu/42</code> returns <code>404</code>.',
      '<code>res.ok</code> is <code>true</code> for any 2xx status and <code>false</code> otherwise.',
      'The body of an error response often explains the problem. Open the row to read it.'
    ],
    code: '<h2>Item details</h2>\n<p id="item">Loading…</p>\n\n' + SO + '\n  async function load() {\n    const res = await fetch("https://bakery.flowpad.test/menu/1");\n    const item = await res.json();\n    document.getElementById("item").textContent = item.name + " costs " + item.price;\n  }\n  load();\n' + SC,
    tasks: [
      { label: 'Request an item that does not exist and get a 404', test: run => req(run, r => /^\/menu\/[^/]+$/.test(r.path) && r.status === 404) },
      { label: 'Check res.ok before using the data', test: (run, code) => /\.ok\b/.test(code) },
      { label: 'Show a message containing "not found" on the page', test: run => text(run).includes('not found') }
    ]
  },
  {
    kicker: 'Lesson 05 · POST',
    title: 'Sending data to the server',
    file: 'order.html',
    blurb: 'GET reads. POST sends data that asks the server to create something. The data travels in the request body, usually as JSON, and a header tells the server what kind of data it is.',
    notes: [
      '<code>fetch(url, { method: "POST", headers: {...}, body: ... })</code> — the second argument describes the request.',
      'The body must be text: <code>JSON.stringify({ item_id: 3, quantity: 2 })</code>. Add the header <code>"Content-Type": "application/json"</code>.',
      'A new order comes back as <code>201 Created</code> with an <code>order_id</code>. A <code>400</code> means the body was wrong; read its message.'
    ],
    code: '<h2>Place an order</h2>\n<p id="result">No order yet</p>\n\n' + SO + '\n  async function order() {\n    // send a POST request to /orders here\n  }\n  order();\n' + SC,
    tasks: [
      { label: 'Send a POST request to /orders', test: run => req(run, r => r.method === 'POST' && r.path === '/orders') },
      { label: 'Get a 201 Created response (a valid JSON body)', test: run => req(run, r => r.method === 'POST' && r.path === '/orders' && r.status === 201) },
      { label: 'Show the order_id the server returned on the page', test: run => run.requests.some(r => r.status === 201 && r.responseJson && run.text.includes(r.responseJson.order_id)) }
    ]
  },
  {
    kicker: 'Lesson 06 · Round trip',
    title: 'Order, then follow up',
    file: 'track.html',
    blurb: 'Real apps chain requests: the answer to one becomes part of the next. Create an order, take the order_id from the response, and use it to ask the server where your order is.',
    notes: [
      'Resources have addresses: an order lives at <code>/orders/&lt;order_id&gt;</code>.',
      'Build the path from data: <code>"https://bakery.flowpad.test/orders/" + created.order_id</code>.',
      'Each request is separate — the server only knows the order because you sent its id.'
    ],
    code: '<h2>Track my order</h2>\n<p id="track">…</p>\n\n' + SO + '\n  async function run() {\n    const res = await fetch("https://bakery.flowpad.test/orders", {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ item_id: 1, quantity: 1 })\n    });\n    const created = await res.json();\n    // now ask the server about this order\n  }\n  run();\n' + SC,
    tasks: [
      { label: 'Create an order (201)', test: run => req(run, r => r.method === 'POST' && r.path === '/orders' && r.status === 201) },
      { label: 'Request /orders/<order_id> for the order you created', test: run => run.requests.some(r => r.status === 201 && r.responseJson && run.requests.some(g => g.method === 'GET' && g.path === '/orders/' + r.responseJson.order_id && g.status === 200)) },
      { label: 'Show the order status ("baking") on the page', test: run => text(run).includes('baking') }
    ]
  }
];

/* ─────────────────────────────── The runner ───────────────────────────────
 * Each edit re-runs the student's page in a fresh sandbox. A small shim inside
 * relays fetch, console and the page text back here, tagged with the run id. */
const SHIM = `<script>
(function(){
  var RUN = __RUN__, seq = 0, waiting = {};
  function post(m){ m.run = RUN; parent.postMessage(m, '*'); }
  window.fetch = function(input, init){
    init = init || {};
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var headers = {};
    var h = init.headers || {};
    if (typeof h.forEach === 'function' && !Array.isArray(h)) h.forEach(function(v,k){ headers[k.toLowerCase()] = v; });
    else Object.keys(h).forEach(function(k){ headers[k.toLowerCase()] = h[k]; });
    var body = init.body;
    if (body !== undefined && body !== null && typeof body !== 'string') body = String(body);
    var id = ++seq;
    post({ kind: 'request', id: id, url: url, method: (init.method || 'GET').toUpperCase(), headers: headers, body: body === undefined ? null : body });
    return new Promise(function(resolve){ waiting[id] = resolve; });
  };
  window.addEventListener('message', function(e){
    var m = e.data;
    if (!m || m.run !== RUN || m.kind !== 'response' || !waiting[m.id]) return;
    var r = waiting[m.id]; delete waiting[m.id];
    r(new Response(m.body, { status: m.status, headers: m.headers }));
  });
  ['log','info','warn','error'].forEach(function(level){
    var orig = console[level];
    console[level] = function(){
      try { post({ kind: 'console', level: level, text: Array.prototype.map.call(arguments, function(a){ try { return typeof a === 'string' ? a : JSON.stringify(a); } catch(e) { return String(a); } }).join(' ') }); } catch(e) {}
      return orig.apply(console, arguments);
    };
  });
  window.addEventListener('error', function(e){ post({ kind: 'console', level: 'error', text: e.message }); });
  window.addEventListener('unhandledrejection', function(e){ post({ kind: 'console', level: 'error', text: 'Unhandled: ' + (e.reason && e.reason.message || e.reason) }); });
  var t = null;
  function snap(){ clearTimeout(t); t = setTimeout(function(){ post({ kind: 'text', text: document.body ? document.body.innerText : '' }); }, 60); }
  document.addEventListener('DOMContentLoaded', function(){ snap(); new MutationObserver(snap).observe(document.body, { subtree: true, childList: true, characterData: true }); });
})();
<\/script>`;

if (/[?&]embedded=1(&|$)/.test(location.search)) document.documentElement.classList.add('embedded');

const STORE = 'client-server-v1';
const LECTURE = '02-web-basics', MODULE = 'client-server';
const STUCK_MS = 4 * 60 * 1000;
const $ = id => document.getElementById(id);
const bridge = () => window.__lessonBridge || null;

const state = { i: 0, codes: L.map(l => l.code), done: {}, results: null, attempts: {}, failStreak: 0, lastEvent: null };
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved && Array.isArray(saved.codes) && saved.codes.length === L.length) {
    state.i = saved.i || 0; state.codes = saved.codes; state.done = saved.done || {};
  }
} catch (e) {}
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify({ i: state.i, codes: state.codes, done: state.done })); } catch (e) {}
  navChanged();
}

/* The lecture page reads and drives lessons through this (same origin). */
function navChanged() {
  setTimeout(() => { try { window.parent.__onModuleNav && window.parent.__onModuleNav(); } catch (e) {} }, 0);
}
window.__lessonNav = {
  title: 'שרת ולקוח',
  count: L.length,
  titles: L.map(l => l.title),
  index: () => state.i,
  done: () => Object.assign({}, state.done),
  go: n => go(n)
};

let runId = 0;
let run = { id: 0, requests: [], console: [], text: '' };

function startRun() {
  runId += 1;
  run = { id: runId, requests: [], console: [], text: '' };
  renderLog();
  const html = '<!doctype html><html><head><meta charset="utf-8">' + SHIM.replace('__RUN__', String(runId)) +
    '<style>body{font:15px/1.55 system-ui,sans-serif;margin:16px;color:#1E1814}h2{margin:0 0 10px}</style></head><body>' +
    state.codes[state.i] + '</body></html>';
  $('preview').srcdoc = html;
}

window.addEventListener('message', e => {
  const m = e.data;
  if (!m || e.source !== $('preview').contentWindow || m.run !== run.id) return;
  if (m.kind === 'request') {
    const answer = handle(m);
    let url = null;
    try { url = new URL(m.url, HOST); } catch (err) {}
    const responseJson = answer.body;
    const responseText = answer.body === null ? '' : JSON.stringify(answer.body);
    run.requests.push({
      method: m.method, url: m.url, path: url ? url.pathname.replace(/\/+$/, '') || '/' : m.url,
      search: url ? url.searchParams : new URLSearchParams(), requestHeaders: m.headers, requestBody: m.body,
      status: answer.status, responseBody: responseText, responseJson
    });
    setTimeout(() => {
      $('preview').contentWindow.postMessage({ kind: 'response', run: m.run, id: m.id, status: answer.status, headers: answer.headers, body: responseText }, '*');
    }, 180);
    renderLog();
  } else if (m.kind === 'console') {
    run.console.push({ level: m.level, text: m.text });
    renderLog();
  } else if (m.kind === 'text') {
    run.text = m.text || '';
  }
});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function pretty(body) { try { return JSON.stringify(JSON.parse(body), null, 2); } catch (e) { return body == null ? '(no body)' : String(body); } }

function renderLog() {
  const rows = run.requests.map(r => {
    const cls = r.status >= 400 ? 's4' : 's2';
    const reqHeaders = Object.keys(r.requestHeaders || {}).map(k => k + ': ' + r.requestHeaders[k]).join('\n');
    const reqText = (reqHeaders ? reqHeaders + '\n\n' : '') + (r.requestBody == null ? '(no body)' : pretty(r.requestBody));
    return '<details class="row"><summary><span class="dir">→</span><span class="method">' + esc(r.method) + '</span><span class="path">' +
      esc(r.path + (r.search && String(r.search) ? '?' + r.search : '')) + '</span><span class="code ' + cls + '">' + r.status + '</span></summary>' +
      '<div class="detail"><div><div class="cap">request</div><pre>' + esc(reqText) + '</pre></div>' +
      '<div><div class="cap">response · ' + r.status + '</div><pre>' + esc(pretty(r.responseBody)) + '</pre></div></div></details>';
  });
  const lines = run.console.map(c => '<div class="console-line' + (c.level === 'error' ? ' err' : '') + '">' + (c.level === 'error' ? '✗ ' : '› ') + esc(c.text) + '</div>');
  $('log').innerHTML = rows.concat(lines).join('') || '<div class="empty">No requests yet. When your code calls fetch(), each request and response appears here.</div>';
}

/* ─────────────────────────── Neti: what she sees ─────────────────────────── */
function lessonState(event) {
  const lesson = L[state.i];
  return {
    lecture: LECTURE,
    module: MODULE,
    page: 'Client ⇄ Server',
    total_lessons: L.length,
    lesson: {
      index: state.i, number: state.i + 1, kicker: lesson.kicker, title: lesson.title, file: lesson.file,
      tasks: lesson.tasks.map((t, n) => ({ label: t.label, passed: state.results ? !!state.results[n] : null }))
    },
    code: state.codes[state.i],
    checked: state.results !== null,
    check_attempts_this_lesson: state.attempts[state.i] || 0,
    failed_checks_in_a_row: state.failStreak,
    lessons_completed: Object.keys(state.done).filter(k => state.done[k]).map(k => Number(k) + 1).sort((a, b) => a - b),
    network: run.requests.slice(-8).map(r => ({
      method: r.method, url: r.url, status: r.status,
      request_body: r.requestBody == null ? null : String(r.requestBody).slice(0, 400),
      response_body: String(r.responseBody).slice(0, 400)
    })),
    console: run.console.slice(-6),
    page_text: run.text.slice(0, 600),
    last_event: event || state.lastEvent
  };
}
function report(type, extra) {
  const b = bridge(); if (!b) return;
  state.lastEvent = Object.assign({ type, at: new Date().toISOString() }, extra || {});
  b.context(lessonState(state.lastEvent));
}
function wake(type, message, extra) {
  const b = bridge(); if (!b) return Promise.resolve(false);
  state.lastEvent = Object.assign({ type, at: new Date().toISOString() }, extra || {});
  const text = message + '\n\n<lesson-event type="' + type + '" lecture="' + LECTURE + '" module="' + MODULE + '" lesson="' + (state.i + 1) + '"/>';
  return b.notify(text, lessonState(state.lastEvent)).then(() => true, e => { console.warn('[lesson] notify failed', e); return false; });
}

/* ─────────────────────────────── Rendering ─────────────────────────────── */
function render() {
  const lesson = L[state.i];
  $('kicker').textContent = lesson.kicker;
  $('title').textContent = lesson.title;
  $('blurb').textContent = lesson.blurb;
  $('file').textContent = lesson.file;
  $('notes').innerHTML = lesson.notes.map(n => '<div class="note"><span>' + n + '</span></div>').join('');
  $('tasks').innerHTML = lesson.tasks.map((t, n) => {
    const pass = state.results ? state.results[n] : null;
    const cls = pass === true ? 'pass' : pass === false ? 'fail' : '';
    return '<div class="task ' + cls + '"><span class="mark ' + cls + '">' + (pass === true ? '✓' : pass === false ? '✕' : '') + '</span><span>' + esc(t.label) + '</span></div>';
  }).join('');
  const passed = state.results ? state.results.filter(Boolean).length : 0;
  $('todoCount').textContent = state.results ? passed + ' / ' + lesson.tasks.length + ' done' : lesson.tasks.length + ' tasks';
  $('todoCount').classList.toggle('all', !!state.results && passed === lesson.tasks.length);
  $('dots').innerHTML = L.map((l, n) => {
    const cls = ['dot', n === state.i ? 'on' : '', state.done[n] ? 'done' : ''].join(' ');
    return '<button class="' + cls + '" title="' + esc(l.title) + '" data-n="' + n + '">' + (state.done[n] ? '✓' : n + 1) + '</button>';
  }).join('');
  if ($('code').value !== state.codes[state.i]) $('code').value = state.codes[state.i];
}

let editTimer = null, lastProgressAt = Date.now(), stuckFor = null;
function go(n) {
  state.i = (n + L.length) % L.length;
  state.results = null; state.failStreak = 0;
  $('msg').textContent = ''; $('msg').className = 'msg'; $('netiStatus').textContent = '';
  persist(); render(); startRun();
  lastProgressAt = Date.now();
  report('lesson_changed');
}

$('dots').addEventListener('click', e => { const b = e.target.closest('.dot'); if (b) go(Number(b.dataset.n)); });
$('prev').addEventListener('click', () => go(state.i - 1));
$('next').addEventListener('click', () => go(state.i + 1));
$('code').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const t = e.target, s = t.selectionStart;
  t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
  t.selectionStart = t.selectionEnd = s + 2;
  t.dispatchEvent(new Event('input'));
});
$('code').addEventListener('input', e => {
  state.codes[state.i] = e.target.value;
  state.results = null;
  clearTimeout(editTimer);
  editTimer = setTimeout(() => {
    persist(); render(); startRun();
    lastProgressAt = Date.now();
    setTimeout(() => report('code_changed'), 900);
  }, 450);
});
$('reset').addEventListener('click', () => {
  state.codes[state.i] = L[state.i].code; state.results = null;
  persist(); render(); startRun(); report('code_reset');
});
$('check').addEventListener('click', () => {
  const i = state.i, lesson = L[i], code = state.codes[i];
  const results = lesson.tasks.map(t => { try { return !!t.test(run, code); } catch (e) { return false; } });
  const all = results.every(Boolean);
  const passedBefore = state.results ? state.results.filter(Boolean).length : 0;
  if (results.filter(Boolean).length > passedBefore) lastProgressAt = Date.now();
  const wasDone = !!state.done[i];
  if (all) state.done[i] = true;
  state.results = results;
  state.attempts[i] = (state.attempts[i] || 0) + 1;
  state.failStreak = all ? 0 : state.failStreak + 1;
  $('msg').textContent = all ? 'Nice — all done. Head to the next lesson.' : 'Not yet: the items marked × are still missing. The network panel shows what actually happened.';
  $('msg').className = all ? 'msg ok' : 'msg';
  persist(); render();
  if (all && !wasDone) wake('lesson_completed', '(הודעה אוטומטית מהשיעור) סיימתי את שיעור ' + (i + 1) + ' במודול שרת-לקוח ✓');
  else if (!all && state.failStreak === 2) wake('check_failed_again', '(הודעה אוטומטית מהשיעור) הבדיקה נכשלה פעמיים ברצף בשיעור ' + (i + 1) + ' במודול שרת-לקוח.');
  else report(all ? 'check_passed' : 'check_failed');
});
$('explainBtn').addEventListener('click', () => {
  if (!bridge()) return;
  $('netiStatus').textContent = "נטי מכינה הסבר… הוא מגיע בצ'אט שליד השיעור.";
  wake('explain_requested', '🧑‍🏫 נטי, תסבירי לי על מה התרגיל הזה: שיעור ' + (state.i + 1) + ' במודול שרת-לקוח — ' + L[state.i].title);
});
$('askBtn').addEventListener('click', () => {
  const question = $('ask').value.trim();
  if (!bridge()) { $('netiStatus').textContent = 'נטי זמינה כשהשיעור פתוח בתוך Flowpad.'; return; }
  $('netiStatus').textContent = 'שולחים לנטי…';
  const message = question ? '🙋 ' + question : '🙋 אשמח לרמז לשיעור ' + (state.i + 1) + ' במודול שרת-לקוח.';
  wake('help_requested', message, question ? { question } : {}).then(ok => {
    if (ok) { $('ask').value = ''; $('netiStatus').textContent = "נטי קיבלה את השאלה. התשובה מגיעה בצ'אט שליד השיעור."; }
    else $('netiStatus').textContent = 'לא הצלחנו להגיע לנטי. נסו שוב בעוד רגע.';
  });
});

setInterval(() => {
  if (!bridge() || state.done[state.i] || stuckFor === state.i) return;
  if (Date.now() - lastProgressAt < STUCK_MS) return;
  stuckFor = state.i;
  wake('stuck', '(הודעה אוטומטית מהשיעור) עובדים כבר כמה דקות על שיעור ' + (state.i + 1) + ' במודול שרת-לקוח בלי התקדמות.');
}, 30 * 1000);

render();
startRun();
navChanged();
if (bridge()) {
  $('neti').classList.add('on');
  $('explainBtn').classList.add('on');
  bridge().ready.then(() => setTimeout(() => report('page_opened'), 900), () => { $('neti').classList.remove('on'); $('explainBtn').classList.remove('on'); });
}

/* For exercises/client-server-lessons.json and tests. */
window.__clientServerLessons = L;
window.__clientServerHandle = handle;
</script>
<script src="code-helpers.js"></script>
</body>
</html>
