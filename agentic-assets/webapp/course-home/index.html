<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקורס</title>
<style>
  :root { --bg:#fff; --fg:#0f172a; --muted:#64748b; --card:#f8fafc; --border:#e2e8f0; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#e2e8f0; --muted:#94a3b8; --card:#111827; --border:#1f2937; --accent:#818cf8; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:28px; margin:0 0 6px; } .sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .card { border:1px solid var(--border); background:var(--card); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:8px; }
  .card h2 { font-size:18px; margin:0; } .card p { color:var(--muted); margin:0; flex:1; }
  button { align-self:flex-start; border:0; border-radius:10px; padding:9px 18px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font-size:15px; }
  .msg { color:var(--muted); font-size:13px; margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>הקורס</h1>
  <p class="sub">בחרו שיעור. כל שיעור נפתח עם הסוכן שלו, והעבודה שלכם נשמרת בתיקייה של השיעור.</p>
  <div class="grid" id="lessons"></div>
  <p class="msg" id="msg"></p>
</main>
<script type="module">
  // The project this app belongs to: from the SDK when the page is served by Flowpad.
  async function projectId() {
    try {
      const sdk = await import('/sdk/flowpad-sdk.js');
      const host = await sdk.resolveAppHost?.();
      return host?.app?.project_id || null;
    } catch { return null; }
  }
  const lessons = await (await fetch('./lessons.json')).json();
  const pid = await projectId();
  const grid = document.getElementById('lessons');
  for (const l of lessons) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2></h2><p></p><button>התחילו</button>`;
    card.querySelector('h2').textContent = l.title;
    card.querySelector('p').textContent = l.subtitle;
    card.querySelector('button').addEventListener('click', () => {
      const agentId = l.agent.replace(/^agent-/, '');
      const params = new URLSearchParams({ action: 'launch', agent: agentId });
      if (pid) params.set('target_local', pid); else params.set('target_local', 'pick');
      // Flowpad's own launch path: the host opens the agent's chat in this project.
      window.parent.postMessage({ type: 'flowpad:navigate', address: `/dock/home?${params}` }, '*');
    });
    grid.appendChild(card);
  }
  if (window.parent === window) document.getElementById('msg').textContent = 'פתחו את הדף הזה בתוך Flowpad כדי להפעיל שיעור.';
</script>
</body>
</html>
